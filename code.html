<!DOCTYPE html>
<html lang="en">

<head>
<link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<Title>Contact Form</Title></head>
<body><main class="content">
<h1 id="headline"><b>CONTACT US</b></h1>
<form>
<section class="first-section" id="first">
<label for="user-name" class="label">Your Name :</label><input class="inputdata" type="text" id="user-name"><br>
<label for="user-email" class="label">Your Email :</label><input class="inputdata" type="email" id="user-email"><br>
<button type="button" class="get-started">Get Started</button></section>
<section class="second-section hidden">
<label for="subject" class="label">Subject :</label><input class="inputdata" type="text" id="subject"><br>

<label for="message" class="label">Write Here :</label><br><textarea rows="7" class="message" id="messege"></textarea><br>

<input type="submit" id="submit"></section>
<section class="ThankYou hidden" >
    <h1>Thank You !</h1>
    <p>Your message has been successfully submitted.</p>
</section>








</form>
</main>
<script src="script.js"></script>
</body>





</html>
